[project]
name = "yt-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "mutagen>=1.48.1",
    "opencc-python-reimplemented>=0.1.7",
    "pyside6>=6.11.1",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]
# GPU 主機的容器用顯示卡跑 faster-whisper 要的 CUDA 函式庫（ctranslate2 4.x 要 cuDNN 9）。
# 只在 Linux 裝：Windows 桌面 app 走 CPU。
whisper-gpu = [
    "nvidia-cublas-cu12 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'linux'",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
