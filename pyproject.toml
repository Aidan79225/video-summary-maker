[project]
name = "yt-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "mutagen>=1.48.1",
    "opencc-python-reimplemented>=0.1.7",
    "pyside6>=6.11.1",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]
# 用顯示卡跑 faster-whisper 要的 CUDA 函式庫（ctranslate2 4.x：CUDA 12、cuDNN 9）。
# Linux：GPU 主機的容器，Dockerfile 用 LD_LIBRARY_PATH 指給它。
# Windows：桌面 app，`uv sync --group whisper-gpu`。ctranslate2 的 Windows 版自帶 cuDNN，只缺 cuBLAS
# （下載約 630 MB），程式載入模型前會把它的資料夾放上 PATH。
whisper-gpu = [
    "nvidia-cublas-cu12 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'linux'",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
