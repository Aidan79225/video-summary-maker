# 立院質詢日報——Pi（或任何一台 Linux 主機）上的整套服務。
#
#   Portainer：Stacks → Add stack → Repository，指到這個 repo 的 compose.yaml，
#              環境變數照 .env.docker.example 填在 Portainer 的表單裡。
#   命令列：  cp .env.docker.example .env && docker compose up -d --build
#
# cloudflared 一定會啟動（Portainer 沒有 compose profile 的開關）。只在區網、
# 不對外的話，把最下面的 cloudflared 那一段刪掉即可。
#
# GPU 主機上的摘要 API（serve_api.py）不在這裡：它要直接用 Windows 上的
# Ollama 與顯示卡，維持原生執行，這裡只透過 GPU_API_BASE 連過去。

x-news-backend: &news-backend
  build:
    context: ./services/news
    # Pi5 上容器走 bridge 連國外套件庫只有幾十 KB/s，建置時改走 host 網路（只影響 build）
    network: host
  image: ly-news-backend
  restart: unless-stopped
  # 和 Pi 上其他 stack 一樣用 uid 1000 跑：磁碟陣列上的資料夾交給 1000 就好，不會留下 root 的檔案
  user: "1000:1000"
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?請在 .env 設定 DJANGO_SECRET_KEY}
    # api 是前端容器連過來時用的主機名，一定要在清單裡，否則 Django 回 400
    DJANGO_ALLOWED_HOSTS: api,localhost,127.0.0.1,${PUBLIC_HOSTS:-pi.local}
    GPU_API_BASE: ${GPU_API_BASE:?請在 .env 設定 GPU_API_BASE}
    GPU_API_KEY: ${GPU_API_KEY:-}
    GPU_JOB_TIMEOUT_SECONDS: ${GPU_JOB_TIMEOUT_SECONDS:-1800}
    INGEST_DAILY_LIMIT: ${INGEST_DAILY_LIMIT:-20}
    INGEST_HOUR: ${INGEST_HOUR:-4}
    TZ: Asia/Taipei
  volumes:
    # 資料庫與截圖：唯一重建不了的東西，放磁碟陣列（appdata/ly-news）。api 與 scheduler 共用同一份。
    - ${DATA_DIR:?請設定 DATA_DIR（磁碟陣列上的資料夾，例如 /srv/dev-disk-by-uuid-…/appdata/ly-news）}:/data

services:
  api:
    <<: *news-backend
    container_name: ly-news-api
    ports:
      # 區網要直接拿截圖（PUBLIC_MEDIA_BASE 指向這裡）與進後台時用。
      # 全部走 Cloudflare 的話可以把這兩行拿掉。
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    <<: *news-backend
    container_name: ly-news-scheduler
    # 每天 INGEST_HOUR:10 匯入；啟動時回補最近三天
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      api:
        # 等 api 把 migrate 跑完，兩邊才不會搶著建表
        condition: service_healthy

  web:
    build:
      context: ./web/news
      network: host
    image: ly-news-web
    container_name: ly-news-web
    restart: unless-stopped
    environment:
      # SSR 在容器網路裡直接找 api
      PUBLIC_API_BASE: http://api:8000
      # 圖片網址會原樣送到瀏覽器：要填「讀者的裝置」連得到的位址
      PUBLIC_MEDIA_BASE: ${PUBLIC_MEDIA_BASE:?請在 .env 設定 PUBLIC_MEDIA_BASE}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-8000}
    ports:
      - "${WEB_PORT:-4321}:4321"
    depends_on:
      - api
    mem_limit: 512m

  cloudflared:
    # 用 Cloudflare 後台建立的 tunnel（token 模式），轉送規則在後台設定：
    #   news.aidan.tw  path: media/*  →  http://api:8000
    #   news.aidan.tw                 →  http://web:4321
    # /api 與 /admin 不在規則裡，所以外面碰不到 Django 的其他部分。
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-news
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # 和 ebook／其他 stack 共用同一條 tunnel（pi5-services），token 相同；每個 stack 各跑一個 connector
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?請設定 CLOUDFLARE_TUNNEL_TOKEN；不對外的話刪掉 cloudflared 這個服務}
    depends_on:
      - web
      - api
